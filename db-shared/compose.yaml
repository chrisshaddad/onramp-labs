name: onramp-labs

x-postgres: &postgres
  image: postgres:18.6-trixie        # pinned: plans and output in the READMEs match this version
  shm_size: 256mb
  environment:
    POSTGRES_PASSWORD: onramp        # lab only, never a real password
    POSTGRES_DB: onramp
    PGUSER: postgres                 # so `docker exec ... psql` needs no flags
    PGDATABASE: onramp
    PSQLRC: /labs/db-shared/psqlrc
  restart: unless-stopped

services:
  db:
    <<: *postgres
    container_name: onramp-db
    ports:
      - "${DB_PORT:-5432}:5432"      # set DB_PORT if a local Postgres already uses 5432
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_parallel_workers_per_gather=0   # readable plans; production keeps the default (2)
    volumes:
      - db-data:/var/lib/postgresql  # Postgres 18 images: PGDATA is /var/lib/postgresql/18/docker
      - ../:/labs:ro

  pitr:
    <<: *postgres
    container_name: onramp-pitr
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
      - -c
      - archive_timeout=60
      - -c
      - max_parallel_workers_per_gather=0
    volumes:
      - pitr-data:/var/lib/postgresql   # data, WAL archive, base backup and restore dir share this volume
      - ../:/labs:ro
      - ../db-02-pitr-restore/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  db-data:
  pitr-data:
