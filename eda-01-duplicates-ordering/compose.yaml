name: onramp-eda

# eda-01: one Kafka broker, one Postgres for consumer state, one container to work in.
# No published ports: everything runs inside with `docker exec`, so nothing clashes with onramp-db on 5432.

services:
  kafka:
    image: apache/kafka:4.3.1                  # pinned: latest 4.x on Docker Hub, checked 2026-10-04
    container_name: onramp-eda-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller   # single node, KRaft (no ZooKeeper)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0       # no 3 s wait when a consumer joins an empty group
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # demo setup creates topic orders explicitly
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:18.6-trixie                # pinned: same image as the db labs
    container_name: onramp-eda-db
    environment:
      POSTGRES_PASSWORD: onramp                # lab only, never a real password
      POSTGRES_DB: eda
    volumes:
      - eda-db:/var/lib/postgresql             # Postgres 18 images: mount the parent, not .../data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eda"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: ./app
    image: onramp-eda-app
    container_name: onramp-eda-app
    hostname: eda-app                          # the prompt reads node@eda-app
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://postgres:onramp@db:5432/eda
    volumes:
      - ./:/lab:ro                             # README, sql and scripts visible inside
    depends_on:
      kafka: { condition: service_healthy }
      db:    { condition: service_healthy }
    command: ["sleep", "infinity"]
    init: true                                 # sleep exits on docker stop instead of waiting 10 s
    restart: unless-stopped

volumes:
  eda-db:
