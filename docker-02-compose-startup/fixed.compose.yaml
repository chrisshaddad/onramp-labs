name: onramp-docker02
services:
  api:
    build: ./api
    env_file: db.env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    env_file: db.env
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U postgres
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
